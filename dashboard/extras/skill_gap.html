<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Gap Analyzer</title>
    <link rel="stylesheet" href="extras.css?v=3">
</head>
<body>
<main>
    <p><a href="../../">Back to dashboard</a></p>
    <h1>Skill Gap Analyzer</h1>
    <section class="panel">
        <form id="skill-gap-form">
            <div class="form-grid">
                <label>Target role<input name="target_role" required maxlength="160" placeholder="Data Analyst"></label>
                <label>Current skills, comma separated<input name="user_skills" placeholder="Python, SQL"></label>
            </div>
            <label>Or paste resume text<textarea name="resume_text" maxlength="30000"></textarea></label>
            <button type="submit">Analyze skill gap</button>
        </form>
        <p id="message" class="message" role="alert"></p>
    </section>
    <section class="panel"><h2>Analysis results</h2><div id="result" aria-live="polite"></div></section>
</main>
<script src="common.js?v=3"></script>
<script src="skill_gap.js?v=3"></script>
</body>
</html>
